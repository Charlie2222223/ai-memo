# ============================================================================
# fly.toml — Fly.io へのデプロイ設定
#
# 【Fly.io を選んだ理由】
#   ・無料枠がある（このアプリの規模なら月0〜数百円）
#   ・PostgreSQL と Redis を数コマンドで用意できる
#   ・HTTPS証明書が自動
#   ・WebSocket をそのまま扱える（このアプリには必須）
#
# 【重要】このファイルの app 名は世界で一意である必要があります。
#   `fly launch` を実行すると自動で書き換わるので、
#   下の "memo-words" は仮の値です。
# ============================================================================

app = "memo-words"
primary_region = "nrt"   # nrt = 東京。日本から使うので遅延が最小になる

[build]
  dockerfile = "Dockerfile"

# ----------------------------------------------------------------------------
# 全プロセス共通の環境変数
# ----------------------------------------------------------------------------
# 【ここに書いてよいもの】秘密でない設定だけ。
#   このファイルはGitにコミットされるので、
#   APIキーやパスワードは絶対に書かない。
#   秘密は `fly secrets set` で別途登録する（暗号化されて保存される）。
[env]
  RAILS_ENV = "production"
  RAILS_LOG_TO_STDOUT = "true"
  RAILS_SERVE_STATIC_FILES = "true"
  # Pumaのスレッド数。database.yml の max_connections と揃える。
  RAILS_MAX_THREADS = "5"

# ----------------------------------------------------------------------------
# デプロイ時に自動実行するコマンド
# ----------------------------------------------------------------------------
# 【なぜ release_command なのか】
#   マイグレーションを「新しいコードが動き出す前」に1回だけ実行する。
#
#   もし起動コマンドの中で db:migrate すると、
#   コンテナが複数あるとき同時にマイグレーションが走り、競合する。
#   release_command は専用の一時マシンで1回だけ実行される。
[deploy]
  release_command = "bundle exec rails db:migrate"

# ----------------------------------------------------------------------------
# プロセス定義
# ----------------------------------------------------------------------------
# 【1つのイメージから2種類のプロセスを起動する】
#   ローカルの docker-compose で web と worker を分けたのと同じ構成。
#   コードは同じ、起動コマンドだけが違う。
[processes]
  app = "bundle exec rails server -b 0.0.0.0 -p 3000"
  worker = "bundle exec sidekiq -C config/sidekiq.yml"

# ----------------------------------------------------------------------------
# HTTPサービスの設定
# ----------------------------------------------------------------------------
[http_service]
  internal_port = 3000
  # 【必須】HTTPでアクセスされたらHTTPSへ転送する。
  #   セッションCookieに Secure を付けているので、
  #   HTTPのままだとCookieが送られずログインできない。
  force_https = true

  # ------------------------------------------------------------------------
  # 【自動停止・自動起動】
  #   アクセスが無い間はマシンを止め、来たら数百ミリ秒で起動する。
  #   個人用アプリではほとんどの時間アクセスが無いので、
  #   これで料金がほぼゼロになる。
  #
  #   【注意】worker プロセスには適用してはいけない。
  #   止まっているとジョブが処理されないため（下の [[vm]] で分けている）。
  # ------------------------------------------------------------------------
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # ------------------------------------------------------------------------
  # 【WebSocket について】
  #   Fly.io は WebSocket を透過的に扱うので、特別な設定は不要。
  #   ブラウザは wss://memo-words.fly.dev/cable に繋がる。
  #
  #   ただし auto_stop でマシンが止まると接続は切れる。
  #   Action Cable は自動で再接続するので実用上は問題ない。
  # ------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# ヘルスチェック
# ----------------------------------------------------------------------------
# config/routes.rb の `get "up" => "rails/health#show"` を叩く。
# 200が返らなければ、Fly.io が異常と判断して再起動する。
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/up"

# ----------------------------------------------------------------------------
# マシンのスペック
# ----------------------------------------------------------------------------
# 【共通設定】無料枠に収まる最小構成。
#   shared-cpu-1x / 512MB は個人用アプリには十分。
#   メモリ不足で落ちるようなら 1024 に上げる。
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
  # 【worker は auto_stop の対象外】
  #   http_service に含めていないので、常時起動になる。
  #   止まっているとAI生成のジョブが実行されない。
