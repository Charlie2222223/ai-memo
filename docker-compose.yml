# ============================================================================
# docker-compose.yml — 複数コンテナの構成定義
#
# 【Dockerfile との違い】
#   Dockerfile … コンテナ「1つ」の作り方
#   compose    … コンテナ「複数」の関係・起動順・繋がり方
#
#   このアプリは Rails・PostgreSQL・Redis という別々のソフトが協調して動く。
#   それぞれを手作業で `docker run` するのは現実的でないので、
#   1つのファイルにまとめて `docker compose up` の一発で全部立ち上げる。
#
# 【構成（4コンテナ）】
#   web    … Rails（API・SPAの入口HTML・Vueのビルド）  :3000
#   worker … Sidekiq（AI呼び出しを別プロセスで実行）
#   db     … PostgreSQL（データ保存）              :5432
#   redis  … ジョブキュー ＋ WebSocketのpub/sub
#
# 【コンテナを分けている理由】
#   1コンテナ1プロセスが原則。まとめると、片方が落ちても
#   コンテナは生きたままになり「起動しているのに動かない」状態になる。
#   分けておけば docker compose ps でどれが落ちたか一目で分かる。
#
# 【補足】昔は先頭に `version: "3"` と書く決まりがあったが、
#   Docker Compose v2 以降は不要（書くと警告が出る）。
# ============================================================================

services:
  # ==========================================================================
  # web … Railsアプリ本体
  # ==========================================================================
  web:
    # このサービスは Dockerfile.dev からイメージを作る、という指定。
    build:
      context: .                 # Dockerfileに渡す作業フォルダ（＝このフォルダ全体）
      dockerfile: Dockerfile.dev # 使うDockerfileのファイル名（.dev の方）

    # ------------------------------------------------------------------------
    # ポートの公開
    # ------------------------------------------------------------------------
    # "左:右" は "ホストPC側のポート : コンテナ内のポート" の対応。
    # 3000:3000 なら、ブラウザで localhost:3000 を開くと
    # コンテナ内の3000番（Railsサーバー）に転送される。
    #
    # 【なぜこの設定が必要か】コンテナは既定では外部から隔離されている。
    #   明示的に「この扉だけ開ける」と宣言しないと、ホストから一切繋がらない。
    #   セキュリティ上、閉じているのが既定という設計になっている。
    ports:
      - "3000:3000"   # Rails

    # ------------------------------------------------------------------------
    # ボリューム（フォルダの共有）
    # ------------------------------------------------------------------------
    # 【1行目 .:/app が最重要】
    #   ホストPCのこのフォルダを、コンテナ内の /app に「そのまま繋ぐ」。
    #   これにより、あなたがVSCodeでコードを保存した瞬間、
    #   コンテナの中のファイルも同時に変わる。
    #   → イメージを作り直さずに開発できる。これが開発用composeの肝。
    #
    # 【2行目以降の意味】← ここは分かりにくいが重要
    #   1行目でホスト側を丸ごと被せると、コンテナ内で
    #   ビルド時にインストールした bundle/node_modules も
    #   「ホスト側の（存在しない）中身」で上書きされて消えてしまう。
    #
    #   そこで「この場所だけはホストと繋がず、コンテナ専用の保管領域を使う」
    #   と指定して、上書きから守る。これを匿名/名前付きボリュームと呼ぶ。
    #
    #   副次的な利点：node_modules（数万ファイル）がホスト側に出てこないので、
    #   OneDriveの同期対象にならず、Windowsでの動作が劇的に速くなる。
    volumes:
      - .:/app                      # コード共有（保存すれば即反映）
      - bundle_data:/usr/local/bundle # gem置き場を保護
      - node_modules:/app/node_modules # npmパッケージ置き場を保護

    # ------------------------------------------------------------------------
    # 環境変数
    # ------------------------------------------------------------------------
    # コンテナの中で使える変数。アプリはここから接続先やAPIキーを読む。
    #
    # 【なぜ設定ファイルに直書きしないのか】← セキュリティの基本
    #   APIキーやパスワードをコードに書くと、Gitにコミットされ、
    #   GitHubに上げた瞬間に世界中から読めてしまう。
    #   （ボットが24時間スキャンしていて、数分で悪用される実例が多数ある）
    #   環境変数にしておけば、コードと秘密情報を分離できる。
    environment:
      # db への接続先。ホスト名が "db" なのがポイント（下の解説を参照）
      DATABASE_URL: postgres://postgres:password@db:5432/memo_development
      # redis への接続先。同様にホスト名は "redis"
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: development
      # ${...} は「ホストPCの .env ファイルから読む」という意味。
      # APIキーのような本当の秘密は、このymlにすら書かない。
      #
      # 【なぜ compose に「変数名」だけ書く必要があるのか】
      #   ホストPCに .env があっても、コンテナの中からは見えない。
      #   コンテナは隔離された別のOSなので、
      #   「どれを中へ渡すか」をここで明示的に指定する必要がある。
      #   書き忘れても起動は成功し、アプリ側で単に未設定として
      #   振る舞うだけなので、原因が非常に分かりにくい。
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # seed（db/seeds.rb）で作る自分用アカウントの情報。
      # ここに値を直接書かず .env 経由にしているのは、
      # docker-compose.yml はGitにコミットされるため。
      SEED_USER_EMAIL: ${SEED_USER_EMAIL}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}

      # ----------------------------------------------------------------------
      # Vite開発サーバーの場所（HMR用）
      # ----------------------------------------------------------------------
      # config/vite.json の "host" を環境変数で上書きしている。
      # vite_ruby は VITE_RUBY_<設定名> という名前の環境変数を
      # 設定ファイルより優先して読む（config.rb の config_from_env）。
      #
      # 【なぜ上書きが必要か】この "host" は2つの意味で使われる:
      #   ・vite コンテナでは「どのアドレスで待ち受けるか」→ 0.0.0.0 が正しい
      #   ・web コンテナでは「どこへ中継するか」    → vite が正しい
      # 同じ設定キーなのに正解がコンテナごとに違う。
      # そこで vite.json には 0.0.0.0 を書いておき、
      # web だけをこの環境変数で上書きしている。
      #
      # "vite" はサービス名（＝Docker内部でのホスト名）。ファイル末尾の補足を参照。
      VITE_RUBY_HOST: vite

    # ------------------------------------------------------------------------
    # 起動順の制御
    # ------------------------------------------------------------------------
    # 【なぜ必要か】RailsはDBに繋がらないと起動に失敗する。
    #   composeは既定では全コンテナを同時に起動するので、
    #   PostgreSQLの準備が終わる前にRailsが起動して落ちることがある。
    #
    # 【condition: service_healthy の意味】
    #   単なる depends_on は「dbコンテナが起動したら」次へ進むだけで、
    #   「PostgreSQLが接続を受け付ける状態になったか」までは見ない。
    #   起動直後のPostgreSQLは内部初期化で数秒間ビジー状態なので、
    #   これだけでは足りない。
    #   healthcheck（下のdbサービスで定義）と組み合わせることで、
    #   「本当に接続できる状態になるまで待つ」ができる。
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # コンテナ内で対話的な操作（binding.pry でのデバッグ等）を可能にする設定。
    # これが無いと、コードを止めて変数を覗く操作ができない。
    stdin_open: true
    tty: true

  # ==========================================================================
  # vite … フロントエンドの開発サーバー（HMR＝保存した瞬間に画面へ反映）
  # ==========================================================================
  # 【このコンテナが無いとどうなるか】
  #   画面（.vue）は一切表示されない。Rails は自前でJSを持たず、
  #   /vite-dev/... へのリクエストを全てこのコンテナへ中継する構成のため。
  #   本番では事前にビルドした静的ファイルを配信するので、これは開発専用。
  #
  # 【なぜ web と別コンテナなのか】
  #   1コンテナ1プロセスにしておくと、
  #   `docker compose logs -f vite` でフロントのビルドエラーだけを追える。
  #   Railsのリクエストログに混ざると、Vueの構文エラーを見落とす。
  #   また Vite だけを再起動できる（設定変更が頻繁にある）。
  #
  # 【web と同じイメージを使う理由】
  #   node_modules ボリュームを web と共有するため、
  #   同じイメージ・同じパス構成である必要がある。
  vite:
    build:
      context: .
      dockerfile: Dockerfile.dev

    # 【web との違いはこの行だけ】Railsではなく Vite開発サーバーを起動する。
    command: bin/vite dev

    # ------------------------------------------------------------------------
    # 【なぜ3036をホストに公開するのか】← HMRの肝
    #   アセット本体は Rails(3000) 経由で届くので、一見この公開は不要に見える。
    #   しかしHMRの「変更したよ」という通知はWebSocketで流れ、
    #   これはRailsが中継できない（vite_ruby の proxy は Rack::Proxy 製で
    #   Upgrade を扱えない）。
    #   そのためブラウザはこのポートへ直接繋ぐ。閉じるとHMRだけが
    #   静かに動かなくなる（画面は出るが自動更新されない）。
    ports:
      - "3036:3036"

    # web と同じボリューム構成。
    # 【.:/app が必須な理由】ホストで .vue を保存したことを
    #   このコンテナが検知できないとHMRは始まらない。
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
      - node_modules:/app/node_modules

    # ------------------------------------------------------------------------
    # 【環境変数が web より大幅に少ない理由】
    #   このコンテナはDBにもRedisにもClaudeにも繋がない。
    #   .vue を JavaScript に変換して配るだけの役割なので、
    #   APIキーを渡す必要がない。
    #   秘密情報は「必要なコンテナにだけ渡す」のが原則。
    #   渡す先が増えるほど漏洩経路が増える。
    # ------------------------------------------------------------------------
    environment:
      RAILS_ENV: development
      # ここでは VITE_RUBY_HOST を設定しない。
      # config/vite.json の "0.0.0.0"（全アドレスで待ち受け）が正解のため。
      # web 側だけが "vite" で上書きしている。理由は web の環境変数を参照。

  # ==========================================================================
  # worker … Sidekiq（AI呼び出しを実行するプロセス）
  # ==========================================================================
  # 【なぜ web と別のコンテナなのか】
  #   AI呼び出しは1件10秒かかる。これを web の中で実行すると、
  #   Railsが同時に処理できるリクエスト枠（既定5本程度）を
  #   長時間占有してしまい、他のページが開けなくなる。
  #
  #   処理を別プロセスに逃がせば、web は常に軽いリクエストだけを
  #   捌ける状態を保てる。
  #
  # 【web と同じイメージを使う理由】
  #   ジョブのコード（app/jobs/）もモデルも、
  #   web と全く同じものを使う。違うのは「起動時に何を実行するか」だけ。
  #   イメージを分けると、コードの同期漏れという事故が起きる。
  #
  # 【スケールのさせ方】
  #   単語を大量に登録して処理が追いつかなくなったら
  #     docker compose up -d --scale worker=3
  #   でワーカーを3プロセスに増やせる。
  #   Redisが待ち行列を管理しているので、
  #   複数のワーカーが同じジョブを二重に取ることはない。
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev

    # 【web との唯一の違いがこの行】
    #   Railsサーバーではなく Sidekiq を起動する。
    #
    #   -C は設定ファイルの指定。
    #   どのキューをどの優先度で処理するかを config/sidekiq.yml に書く。
    command: bundle exec sidekiq -C config/sidekiq.yml

    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
      - node_modules:/app/node_modules

    # 【環境変数は web と同一にする】
    #   ワーカーも同じDBに書き込み、同じRedisに繋ぎ、
    #   同じAPIキーでClaudeを呼ぶ。
    #   ここが web とずれると「web では動くのにジョブだけ失敗する」
    #   という切り分けの難しい不具合になる。
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/memo_development
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: development
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================================================================
  # db … PostgreSQL（データの保管庫）
  # ==========================================================================
  db:
    # 自分でDockerfileを書く必要はない。公式イメージをそのまま使う。
    # 【なぜバージョンを固定するか】"postgres:latest" にすると、
    #   ある日メジャーバージョンが上がってデータ形式が変わり、
    #   既存データが読めなくなる事故が起きる。必ず数字で固定する。
    image: postgres:16

    environment:
      # 公式イメージが初回起動時に読む決まった名前の変数。
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password  # ローカル開発専用。本番では絶対に使わない
      POSTGRES_DB: memo_development

    # ------------------------------------------------------------------------
    # 【なぜ名前付きボリュームが必須か】← ここを間違えるとデータが消える
    #   コンテナは本来「使い捨て」で、消すと中身も全部消える。
    #   DBのデータをコンテナ内に置いたままだと、
    #   `docker compose down` した瞬間に登録した単語が全部消える。
    #   ボリュームに置いておけばコンテナとは独立して残る。
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # ------------------------------------------------------------------------
    # ヘルスチェック（本当に使える状態かの確認）
    # ------------------------------------------------------------------------
    # pg_isready は「PostgreSQLが接続を受け付けられるか」を返すコマンド。
    # これが成功して初めて "healthy" と判定され、web の起動が始まる。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s   # 5秒ごとに確認
      timeout: 5s    # 5秒返事がなければ失敗扱い
      retries: 10    # 10回失敗したら異常と判断

    # ホストPCからDBを直接覗きたいとき用（TablePlus等のGUIツール）。
    # アプリからの接続にはこの設定は不要（コンテナ間は下記の内部ネットワークで繋がる）。
    ports:
      - "5432:5432"

  # ==========================================================================
  # redis … ジョブキュー ＋ WebSocketの中継役
  # ==========================================================================
  # 【このアプリでRedisが担う2つの役割】
  #   ① ジョブキュー（段階5）
  #      「この単語のAI解説をやっといて」という依頼を貯める待ち行列。
  #      Railsが依頼を積み、Sidekiqワーカーが取り出して実行する。
  #
  #   ② pub/sub（段階5）
  #      ワーカーが「終わったよ」と叫び、Railsが聞いてブラウザへ流す放送設備。
  #      AI呼び出しが終わったプロセスと、ブラウザがWebSocketで繋がっている
  #      プロセスは別物なので、両者を繋ぐ仲介が要る。それがこれ。
  #
  # 同じミドルウェアが文脈によって別の役割を持つ、という良い例。
  redis:
    image: redis:7-alpine   # alpine = 超軽量版。Redisは依存が少ないので相性が良い

    # 【なぜRedisにもボリュームが要るか】
    #   Redisはメモリ上でデータを扱うが、定期的にディスクへ保存もできる。
    #   実行待ちのジョブが溜まっている状態でコンテナを再起動したとき、
    #   ボリュームが無いとその依頼が消える（＝AI解説が永久に生成されない単語ができる）。
    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]  # 正常なら "PONG" が返る
      interval: 5s
      timeout: 3s
      retries: 10

# ============================================================================
# ボリュームの宣言
# ============================================================================
# 上の services 内で名前で参照したボリュームを、ここで正式に定義する。
# 実体はDockerが管理する領域に作られ、コンテナを消しても残り続ける。
#
# 【中身を全部消してやり直したいとき】
#   docker compose down -v      ← -v を付けるとボリュームごと削除される
#   （DBの中身が全部消えるので、実行前に必ず意図を確認すること）
volumes:
  postgres_data:   # DBの実データ
  redis_data:      # ジョブキューの内容
  bundle_data:     # インストール済みgem
  node_modules:    # インストール済みnpmパッケージ

# ============================================================================
# 【補足：コンテナ同士はどうやって通信しているのか】
#
#   composeは、書かれた全サービスを1つの仮想ネットワークに自動で入れる。
#   そのネットワーク内では「サービス名がそのままホスト名」になる。
#
#   だから上の環境変数で
#       postgres://postgres:password@db:5432/...
#                                    ↑ この "db" はサービス名
#   と書ける。IPアドレスを調べる必要はない。
#
#   ここで重要なのは、この "db" や "redis" という名前は
#   コンテナの中からしか解決できないこと。
#   ホストPCのブラウザで http://db:5432 と打っても繋がらない。
#   ホストから繋ぐには ports で公開した localhost:5432 を使う。
#
#   「コンテナ内から見た世界」と「ホストから見た世界」で
#   使うべき住所が違う ——ここは最初に必ず混乱するポイント。
# ============================================================================
