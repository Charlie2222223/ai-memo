# ============================================================================
# sidekiq.yml — ワーカープロセスの設定
#
# docker-compose.yml の worker サービスが
#   bundle exec sidekiq -C config/sidekiq.yml
# で読み込む。
# ============================================================================

# ----------------------------------------------------------------------------
# 同時実行数
# ----------------------------------------------------------------------------
# 【何を意味するか】1つのワーカープロセスの中で、
#   同時に何個のジョブを並行処理するか。
#
# 【なぜ5なのか】
#   AI呼び出しは「待ち時間がほとんど」の処理（I/O待ち）。
#   CPUはほぼ使わないので、待っている間に他のジョブを進められる。
#   → 数を増やす効果が大きい。
#
#   ただし各ジョブがDB接続を1本使うため、
#   database.yml の max_connections（5）を超えると
#   接続待ちで詰まる。両者は揃えておく必要がある。
#
#   【落とし穴】ここを10にして max_connections が5のままだと、
#   「ジョブが時々 ActiveRecord::ConnectionTimeoutError で落ちる」
#   という再現しにくい不具合になる。片方だけ変えないこと。
:concurrency: 5

# ----------------------------------------------------------------------------
# 処理するキューと優先度
# ----------------------------------------------------------------------------
# 【書き方】- [キュー名, 重み]
#   重みが大きいキューほど、取り出される確率が高くなる。
#
# 【なぜ優先度を分けるのか】
#   今は ai_generation しか無いが、将来
#   「パスワードリセットのメール送信」のような
#   軽くて急ぎの処理を足したときに効く。
#
#   1本のキューに全部入れると、
#   AI生成（10秒 × 20件）の後ろでメールが3分待たされる。
#   キューを分けておけば、重い処理の裏で軽い処理が先に進む。
:queues:
  - [ai_generation, 3]
  - [default, 1]

# ----------------------------------------------------------------------------
# 【リトライについて】
# ----------------------------------------------------------------------------
# ここでは設定していない（＝Sidekiqの既定25回のまま）が、
# ExplainTermJob は例外を再raiseしない作りにしてあるため、
# 実際にはSidekiqのリトライは発動しない。
#
# 【なぜそうしているか】
#   リトライは Llm::Client の層で3回行っている。
#   Sidekiq側でもリトライすると 3 × 25 = 75回 APIを呼ぶことになり、
#   1単語で250円を超える。
#
#   「リトライは1つの層でだけ行う」——多層で重ねない。
#   失敗はDBに記録し、ユーザーが画面から手動で再実行する設計にしている。
