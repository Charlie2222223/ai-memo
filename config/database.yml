# ============================================================================
# database.yml — データベース接続設定
#
# 【Railsの「環境」という考え方】
#   Railsは3つの環境を持ち、それぞれ別のDBに繋ぐ。
#     development … 開発中。手で触るデータが入る
#     test        … テスト実行用。実行のたびに中身が全消しされる
#     production  … 本番。実データが入る
#
#   【なぜ分けるか】testは全消しされる設計なので、もしdevelopmentと
#   同じDBを見ていたら、テストを1回流すだけで開発中のデータが消える。
#   環境ごとに完全に別のDBにしておくのは、事故を構造的に防ぐため。
#
# 【この設定の方針：接続情報はすべて環境変数（DATABASE_URL）から取る】
#   Railsの初期状態は、ここにDB名やユーザー名を直接書く形になっている。
#   それをやめて、接続先の情報は1つの環境変数にまとめている。
#
#   理由は3つ:
#     ① 秘密をコードに書かない
#        本番のDBパスワードをこのファイルに書くと、Gitに残り、
#        リポジトリを見られた時点で漏れる。
#     ② 環境ごとにファイルを書き換えなくて済む
#        ローカルでもFly.ioでも、このファイルは同じまま。
#        変わるのは環境変数の中身だけ。
#     ③ 事実が1箇所にまとまる
#        「どこに繋がっているか」を知りたいとき、
#        docker-compose.yml の DATABASE_URL だけ見れば分かる。
#        設定が2箇所に分散していると必ず食い違う。
#
#   これは "Twelve-Factor App" と呼ばれる設計指針の一つで、
#   「設定はコードではなく環境に置く」という考え方。実務の標準。
# ============================================================================

# ----------------------------------------------------------------------------
# 共通設定
# ----------------------------------------------------------------------------
# 【&default と <<: *default について】これはYAMLの機能。
#   &default     … 「この設定のかたまりに default という名前を付ける」（アンカー）
#   <<: *default … 「default という名前のかたまりをここに展開する」（エイリアス）
#   共通部分を1回書いて3箇所で使い回すための仕組み。
#   同じことを3回書くと、1箇所だけ直し忘れる事故が起きる。
default: &default
  # 使うDBの種類。PostgreSQL用のドライバを使う、という指定。
  adapter: postgresql

  # 文字コード。unicode にしておけば日本語も絵文字も問題なく保存できる。
  encoding: unicode

  # 【接続プールの上限】
  #   Railsは複数のリクエストを同時に処理するため、DBへの接続を
  #   何本か開いて使い回す。その本数の上限。
  #
  #   小さすぎると「接続の空き待ち」で処理が詰まり、
  #   大きすぎるとPostgreSQL側の上限（既定100接続）を食い潰す。
  #
  #   Railsのスレッド数（RAILS_MAX_THREADS）と揃えるのが基本。
  #   スレッドが5本なら同時に必要な接続も最大5本、という理屈。
  #   ENV.fetch("X") { 5 } は「環境変数Xがあればそれ、無ければ5」の意味。
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# ----------------------------------------------------------------------------
# 開発環境
# ----------------------------------------------------------------------------
development:
  <<: *default
  # docker-compose.yml で渡している値がそのまま入る:
  #   postgres://postgres:password@db:5432/memo_development
  #             ~~~~~~~~ ~~~~~~~~ ~~ ~~~~ ~~~~~~~~~~~~~~~~
  #             ユーザー  パスワード ホスト ポート  DB名
  #
  # 【ホスト名が "db" である理由】composeが作る仮想ネットワーク内では
  #   サービス名がそのままホスト名になる。IPを調べる必要はない。
  #   なお、この "db" が通じるのはコンテナの中だけ。
  #   ホストPCのGUIツールから繋ぐときは localhost:5432 を使う。
  #
  # 【fetch に引数が1つだけ = 未設定ならエラーで落とす】
  #   ここでデフォルト値を用意しないのは意図的。
  #   設定を忘れたまま起動して、気付かないうちに
  #   意図しないDBへ繋がる方が危険なので、あえて落とす。
  url: <%= ENV.fetch("DATABASE_URL") %>

# ----------------------------------------------------------------------------
# テスト環境
# ----------------------------------------------------------------------------
# 【重要】このDBの中身は、テスト実行のたびに消える。
#   だから development とは絶対に同じにしてはいけない。
test:
  <<: *default
  # 【この式の意味】
  #   TEST_DATABASE_URL があればそれを使う。
  #   無ければ DATABASE_URL の末尾 "_development" を "_test" に置き換える。
  #   → memo_development から memo_test が自動で導かれる。
  #
  # 【なぜ自動で導くのか】環境変数を2つ管理すると、片方だけ直して
  #   食い違わせる事故が起きる。1つから機械的に導けば、ズレようがない。
  #
  # 【\b は単語の境界】"_development" が末尾にある場合だけ置換する。
  #   もしDB名が "my_development_tool" のような名前でも
  #   途中の文字列を誤って書き換えない、という保険。
  url: <%= ENV.fetch("TEST_DATABASE_URL") { ENV.fetch("DATABASE_URL").sub(/_development\b/, "_test") } %>

# ----------------------------------------------------------------------------
# 本番環境（段階8のFly.ioデプロイで使用）
# ----------------------------------------------------------------------------
production:
  <<: *default
  # Fly.ioでPostgreSQLを作ると、DATABASE_URL が自動で設定される。
  # つまりこのファイルは開発時と本番で1文字も変わらない。
  # 「環境ごとにコードを書き換えない」がこの方式の狙い。
  url: <%= ENV.fetch("DATABASE_URL") %>
