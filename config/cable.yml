# ============================================================================
# cable.yml — Action Cable（WebSocket）の設定
#
# 【Action Cable とは】
#   通常のHTTPは「ブラウザが聞いて、サーバーが答える」の一方通行しかできない。
#   サーバー側から勝手に話しかけることはできない。
#
#   WebSocketは接続を繋ぎっぱなしにして、双方向に喋れるようにする技術。
#   Action Cable はそれをRailsから使うための仕組み。
#
#   このアプリでの用途:
#     AI解説は生成に10秒かかるので、裏（Sidekiq）で処理する。
#     終わったときに「できたよ」とブラウザへ push するのがWebSocketの役目。
#     これが無いと、ユーザーは自分でページを再読み込みするしかない。
#
# ----------------------------------------------------------------------------
# 【adapter が意味するもの】← ここが今回の設計の核心
# ----------------------------------------------------------------------------
#   adapter は「複数のプロセス間で、通知をどうやって受け渡すか」の指定。
#
#   なぜプロセスを跨ぐ必要があるのか:
#
#     [Railsプロセス]   ←── ブラウザはこっちとWebSocketで繋がっている
#     [Sidekiqプロセス] ←── AI呼び出しが終わったのはこっち
#
#     この2つは完全に別のプロセス（別のコンテナですらある）。
#     メモリを共有していないので、Sidekiq側で「終わった」と分かっても、
#     そのままではRails側に伝える手段が無い。
#
#     そこで両者が同じRedisを見に行き、
#       Sidekiq → Redisに「terms_1が完成した」と投げる（publish）
#       Rails   → Redisを購読していて受け取る（subscribe）
#       Rails   → 繋がっているブラウザへWebSocketで流す
#     という中継をさせる。これがpub/sub（出版-購読）と呼ばれる仕組み。
# ============================================================================

development:
  # 【Railsの初期値は adapter: async だが、それでは動かない】
  #
  #   async は「同じプロセスの中でだけ通知が届く」という設定。
  #   1プロセスで完結する小さなアプリなら十分だが、
  #   このアプリは Rails と Sidekiq が別プロセスなので、
  #   async のままだと Sidekiq からの通知は誰にも届かず、
  #   カードが永遠に「生成中…」のまま止まる。
  #
  #   しかもエラーにならず、ただ静かに何も起きない。
  #   原因が非常に分かりにくいタイプの不具合なので、
  #   最初から redis にしておく。
  #
  #   【学習ポイント】本番と開発で構成を変えると、
  #   「開発では動くのに本番で動かない」（またはその逆）が起きる。
  #   構成はできる限り揃えておくのが鉄則。
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>

  # 【channel_prefix の役割】
  #   Redisの中で使うキー名の頭に付ける文字列。
  #   1つのRedisを複数の用途で共有するとき、名前の衝突を防ぐ。
  #
  #   このアプリではRedisを2役で使っている:
  #     ① Sidekiqのジョブキュー
  #     ② Action Cableのpub/sub  ← こちら
  #   prefixを付けておけば、互いのキーを踏まない。
  channel_prefix: memo_development

test:
  # テスト時は本物のRedisに繋がない専用アダプタを使う。
  # 【なぜか】テストで実際にWebSocketを繋ぐと、
  #   Redisの起動状態に結果が左右され、テストが不安定になる。
  #   test アダプタは「送られた内容をメモリに記録するだけ」で、
  #   「正しくbroadcastが呼ばれたか」をテストから検証できる。
  adapter: test

production:
  adapter: redis
  # Fly.ioでRedisを用意すると REDIS_URL が自動で設定される。
  url: <%= ENV.fetch("REDIS_URL") %>
  # 開発用と本番用で prefix を変える。
  # 【なぜ】もし同じRedisを共有してしまった場合でも、
  #   開発中の操作が本番ユーザーの画面に流れる事故を防げる。
  channel_prefix: memo_production
